#   chair         – { id: speaker-id }
#   people        – { id: speaker-id, topic: "" }, or { name: "", org: "", topic: "" } for groups and TBCs
#   interactive   – buttons on the /live/ page only (label + url)
#   slides        – shown on every page once added (post-event archive)
days:
  - date: "2026-11-25"
    sessions:
      - start: "09:30"
        end: "10:00"
        kind: break
        title: Registration
        note: Tea, coffee and snacks

      - start: "10:00"
        end: "11:15"
        kind: session
        number: 1
        title: Welcome and introduction
        format: Talks
        description: >-
          The Heads of Node look back at ELIXIR-UK's history and set out where it goes next.
          Our Liverpool hosts then present the research and innovation happening across the city.
        people:
          - { id: neil-hall, topic: "A year in review and the outlook, with the Joint Head of Node" }
          - { id: john-whaling, topic: Liverpool City Region innovation }
          - { id: eva-caamano, topic: Liverpool Shared Facilities and the Civic Innovation Labs }
          - { id: jacqueline-vigilanti, topic: Research data management innovation through Library services }
        interactive: []
        slides: ""

      - start: "11:15"
        end: "11:45"
        kind: break
