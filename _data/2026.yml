# ELIXIR-UK All Hands 2026 – every page for this year is built from this file.
# Empty "" values are hidden on the pages, so fill them in as they arrive.
# REMEMBER: this repo is public. Nothing here is secret, even if it only shows on the /live/ page.

title: ELIXIR-UK All Hands 2026
strapline: Two days in Liverpool with the people building the UK's life-science data infrastructure.
dates: 25–26 November 2026
funding: This event is funded by the Biotechnology and Biological Sciences Research Council (BBSRC) under grant BB/C001384/1.

