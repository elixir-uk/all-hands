      - start: "11:45"
        end: "13:00"
        kind: session
        number: 2
        title: ELIXIR-UK success and future
        format: Lightning talks – five minutes each plus two for questions
        description: >-
          What the Node has achieved this year and who has joined it. Flash talks from our newest member
          institutions, a new Node service and a new community, BioFAIR updates and news from across
          ELIXIR-UK.
        people:
          - { id: andrew-mason, topic: "New member: University of York" }
          - { id: evan-troendle, topic: "New member: Queen's University Belfast" }
          - { id: kedar-natarajan, topic: "New member: University of Southampton" }
          - { id: richard-stark, topic: "New service: EnteroBase" }
          - { id: sascha-ott, topic: "New service: EnteroBase" }
          - { id: eva-caamano, topic: "New community: BioinfoCoreLeaders Club" }
          - { id: saskia-lawson-tovey, topic: "PeerLadder – a national peer mentoring initiative supporting underrepresented dRTP leaders" }
          - { id: tony-burdett, topic: "How have BioFAIR Pathfinders utilised ELIXIR services to drive their projects forward?" }
          - { id: carole-goble, topic: "BioFAIR Methods Commons: a national service for finding, running and sharing FAIR workflows in UK life sciences" }
          - { id: xenia-perez-sitja, topic: "FAIR in action Bridge – a BioFAIR Pathfinder from the RDM Club" }
        interactive: []
        slides: ""

