      - start: "09:30"
        end: "10:45"
        kind: session
        number: 6
        title: Sustaining our resources
        format: Keynote, case studies and panel
        description: >-
          How ELIXIR-UK's endorsed services can adapt as funding changes – a keynote on sustaining
          bioinformatics infrastructure, case studies of different funding models and a panel on
          what transfers.
        chair: { id: neil-hall }
        people:
          - { id: lauren-cockayne, topic: Scoping sustainability for LIPID MAPS }
          - { id: arne-de-klerk, topic: Turning a research tool into a start-up }
          - { id: andy-jones, topic: A subscription model for VEuPathDB – successes and challenges }
          - { id: guy-cochrane, topic: A global perspective }
        interactive:
          - label: Ask the panel a question
            url: ""      # one Slido per panel – see README
        slides: ""

      - start: "10:45"
        end: "11:15"
        kind: break
        title: Coffee break

      - start: "11:15"
        end: "12:45"
        kind: session
        number: 7
        title: "AI-ready bioscience data: what makes a dataset fit for AI?"
        format: Introduction and parallel working strands
        description: >-
          AIBIO-UK's AI-Ready Bioscience Datasets working group (AIRBDS) is building a catalogue of
          AI-ready bioscience datasets and has developed the AIRBDS Core metric – 25 yes-or-no
          questions that score how ready a dataset is for AI. After an introduction, parallel strands
          explore what counts as a dataset, a taxonomy of AI and what AI-readiness needs. You will
          calibrate the metric against the data, resources and discovery processes you know, and help
          decide what the catalogue should include and how it describes datasets. Your ideas and
          requirements feed the afternoon Joint Statement Workshop.
        people:
          - { id: ian-overton, topic: AIRBDS working group }
          - { id: charlie-harrison, topic: AIRBDS working group }
        organisers: Run with AIBIO-UK and AIRBDS
        links:
          - label: AIRBDS Core metric preprint
            url: https://zenodo.org/records/21803891
        interactive:
          - label: "Strand 1 – what counts as a dataset"
            url: ""
          - label: "Strand 2 – taxonomy of AI applications"
            url: ""
          - label: "Strand 3 – what AI-readiness requires"
            url: ""
        slides: ""

      - start: "12:45"
        end: "13:00"
        kind: session
        title: Closing remarks and Impact Award ceremony
        description: >-
          Carole Goble and Neil Hall close the meeting, followed by the ELIXIR-UK Impact Award ceremony.
        people:
          - { id: carole-goble }
          - { id: neil-hall }
          - { id: jason-williams, topic: "Presents the Impact Awards – member of the ELIXIR-UK Scientific and Industry Advisory Board" }
        interactive: []
        slides: ""

      - start: "13:00"
        end: "14:00"
        kind: break
        title: Lunch

      - start: "14:00"
        end: "17:00"
        kind: colocated
        title: "Joint Statement Workshop: shaping a position on AI-ready bioscience datasets"
        format: Co-located workshop, up to three hours
        description: >-
          Participants draft a position statement for data producers, resource managers, scientists,
          funders and policymakers – covering the key AI-readiness issues, gaps in current practice,
          funder priorities and recommendations for the UK community. The statement is planned as a
          peer-reviewed opinion piece from an AIRBDS and ELIXIR-UK partnership.
        organisers: Hosted by AIBIO-UK
        links:
          - label: Workshop topics survey
            url: https://docs.google.com/forms/d/1g_6uhGyEtR3dVuvVQwfpBvN9t2ivQcZWNjOztfgNzeU/viewform
        interactive:
          - label: Statement draft
            url: ""
        slides: ""

      - start: "14:00"
        end: "18:30"
        kind: colocated
        title: ELIXIR-UK Scientific and Industry Advisory Board (SIAB) annual meeting
        format: Co-located – for SIAB and Management Committee members only
        slides: ""

