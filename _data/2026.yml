# ── Intro – house style sections, Markdown allowed ───────────────────────────
# Shown on the home page only while show_intro is true – useful before registration closes.
show_intro: false
intro:
  - heading: What this meeting covers
    body: >-
      The annual gathering of the ELIXIR-UK community. Day one looks back at the Node's year,
      welcomes new members and services, and asks how academic infrastructure works with industry.
      Day two turns to sustaining our endorsed services as funding changes, and to what makes
      bioscience data ready for AI.
  - heading: What to expect
    body: >-
      Talks and lightning talks, two panels, a World Café with eight rotating conversations,
      posters with the bar open and dinner on the first evening. Day two is hands-on: working
      strands on AI-ready data feed a co-located afternoon workshop drafting a position statement.
  - heading: Who is this for
    body: >-
      People at ELIXIR-UK's member institutions – service providers, data stewards, trainers,
      core facility leads, researchers and research managers – and the partners who work with them.
  - heading: How to join
    body: >-
      The meeting is in person at Bluecoat, Liverpool. Register before the deadline below. Travel
      funding was allocated at registration; reimbursement applies only to participants who
      received an acceptance email.

