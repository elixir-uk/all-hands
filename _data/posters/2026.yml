- number: '04'
  title: Data Context Model for FAIR Health Data
  presenter: Esmond Urwin
  authors: |-
    Esmond Urwin [1], Tim Beck [1], Antonella Demestri [2], Armando Mendez-Villalon [1] , Gordon Milligan [3], Andrew Burton [4], Alexander Davydov [5], Bob Laramee [6], Andy Rae [1] , Stefanie Thust [7,8,9], Guruprasad Aithal [10], Philip Quinlan [1]

    1 Centre for Health Informatics, NIHR Nottingham Biomedical Research Centre, Faculty of Medicine and Health Sciences, University of Nottingham, UK.
    2 Nuffield Department of Orthopaedics, Rheumatology and Musculoskeletal Sciences, University of Oxford, UK.
    3 Health Informatics Centre, School of Medicine, University of Dundee, UK.
    4 School of Science and Technology, Nottingham Trent University, UK
    5 Thesaurus Health.
    6 School of Computer Science, University of Nottingham, UK.
    7 Nottingham University Hospitals NHS Trust, Nottingham, UK.
    8 Magnetic Resonance and Precision Imaging, NIHR Nottingham Biomedical Research Centre, University of Nottingham, UK.
    9 Department of Translational Neuroscience and Stroke, UCL Institute of Neurology, London, UK.
    10 Nottingham Digestive Disease Centre, NIHR Nottingham Biomedical Research Centre, Faculty of Medicine and Health Sciences, University of Nottingham, UK.
  abstract: |-
    Introduction
    Health data is being created at an ever-greater rate whilst often being underutilised. Common Data Models (CDM) such as Observational Medical Outcomes Partnership (OMOP) enable Findable, Accessible, Interoperable and Reusable (FAIR) data. When transforming data to OMOP, many factors induce dataset variability, from different systems and software to perspectives and expertise. Yet, there are no formal approaches to represent dataset trustworthiness. The capture and use of context can engender trust and boost dataset comprehension and provide provenance to boost health data research.

    Methods
    Data was collected from three workshops ‘How to be FAIR with Data Standards’ (Nottingham), an ELIXIR All-Hands 2025 workshop (Greece) and a Malaysian OMOP workshop, composed of 112 practitioners and healthcare professionals internationally. The collected qualitative data was analysed using grounded theory coding methods.

    Results
    A data context model has been built, comprising nine concepts: Standards, Quality, Source Dataset, Target OMOP Dataset, Transformation, Transformation Rule, Provenance, Actor and Training. These, when grouped, represent three areas: explicit, derived and implicit factors.

    Conclusion
    A preliminary data context model has been created to represent the amorphous aspects of context that are not included with current datasets. The model aims to reduce dataset ambiguity and variability to boost dataset utility and precision, thus accelerating research outcomes. A JMIR Research Protocols study paper has been submitted pending revisions, furthermore, an NIHR Better Methods Better Research grant has been submitted - the purpose of these is to capture context, test the model and prove the utility of context for data.
