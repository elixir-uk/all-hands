- number: '06'
  title: How have BioFAIR Pathfinders utilised ELIXIR services to drive their projects forward?
  presenter: Edward Clark
  authors: |-
    Tony Burdett (Earlham Institute), Nishadi De Silva (Earlham Institute), Edward Clark (Earlham Institute), Eva Wan (Earlham Institute), Lindsey Crosswell (Earlham Institute), Laura Shemilt (Earlham Institute), Galabina Yordanova (Earlham Institute), Neil Hall (Earlham Institute)
  abstract: |-
    BioFAIR is the UK's national programme, jointly funded by BBSRC and MRC, building a federated and interoperable digital research infrastructure for the life sciences. In 2026, BioFAIR invested over £800,000 in nine Pathfinder projects: short, focused initiatives that tackle real FAIR bottlenecks within a defined scientific question, and whose experience feeds directly into the design of BioFAIR's infrastructure. A guiding principle of the programme is that Pathfinders should build on and connect existing solutions rather than reinvent them, making ELIXIR and other established community services a natural starting point for many teams.

    We draw from the first cohort of Pathfinder Projects, now well into delivery and spanning domains from digital pathology to ecological monitoring, to examine how Pathfinder teams have used ELIXIR resources in practice. Examples include connecting Bioconductor single-cell workflows with Galaxy and nf-core to create an interoperable, cross-platform baseline; co-creating with the Europe PMC team to make publication figures searchable and AI-ready; piloting integration of a comparative metabolomics platform with ELIXIR-UK endorsed resources; and an ELIXIR-UK-led project translating FAIR guidance into practical playbooks for research data management professionals across UK institutions.

    We highlight where ELIXIR services accelerated progress, where teams encountered gaps in discoverability or integration, and what support enabled them to adopt established resources rather than build bespoke alternatives. We then consider what these lessons mean for ELIXIR-UK and BioFAIR working together to connect UK researchers with essential tools and services, and to shape a coherent national offer that makes FAIR practice the natural default for UK life sciences.
