- number: '21'
  title: 'A Research Office without a University: Fiscal Sponsorship for Open Science'
  presenter: Yo Yehudi
  authors: |-
    Laura Carter, OLS
    Yo Yehudi, OLS
  abstract: |-
    Research projects that are part of universities or big institutes have support from their institutions to handle activities like reviewing budgets, issuing contracts, and making sure staff and contractors get paid on time. But not all projects that need this support are part of a university. For smaller, grassroots, or community-focused projects, a fiscal sponsor can be a useful partner to handle human and legal infrastructure.

    OLS is a not-for-profit organisation dedicated to capacity building and diversifying leadership in research worldwide. Alongside training and mentoring, and research on open leadership, we offer fiscal sponsorship to help develop and sustain open science communities. This poster presents three case studies from OLS’s Fiscally Sponsored Communities programme: managing grants for a one-off event, providing guidance and support to incubate an independent organisation, and long-term infrastructure partnership to help a project receive grants and contracts.

    Fiscal sponsorship can provide flexibility for international projects and can handle a broad range of funding sources, from grants and contracts to ticket sales and individual donations. As well as demonstrating our fiscal sponsorship model, we also present learnings from setting up the programme and from our first year of allocating dedicated staff time to provide administrative support and guidance to build out the programme as well as work directly with fiscally sponsored communities.
