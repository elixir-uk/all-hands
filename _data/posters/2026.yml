- number: '25'
  title: Predicting network rewiring from single-cell transcriptomics with perturbation-informed graph autoencoders
  presenter: Kedar Natarajan
  authors: |-
    Shreyansh Priyadarshi, University of Southampton, UK
    Kedar Natarajan, University of Southampton, UK
  abstract: |-
    Gene regulatory networks (GRNs) provide an important framework for understanding how complex cellular behaviors emerge from genomic instructions. Computing these networks from single-cell transcriptomics is essential for mapping cellular states, yet traditional methods often treat GRNs as static maps. In reality, perturbations induce significant regulatory changes absent from reference networks. To address this, we develop DS-GAE, a topology-informed graph autoencoder that integrates a baseline GRN with single-cell expression data to infer condition-specific networks following transcription factor knockdown or overexpression. By learning dynamic regulatory influences along known pathways, DS-GAE predicts novel regulator–target interactions and captures structural rewiring missed by static models. We validate these predictions against several published multiomics networks. This framework shifts GRN inference toward predicting dynamic regulatory plasticity in response to genetic changes.
