- number: 09
  title: 'FAIR-Figures: Enabling AI-ready image datasets from biomedical literature'
  presenter: Tim Beck
  authors: |-
    Tim Beck, University of Nottingham
    Matt Jeffryes, EMBL-EBI
    Yajie Gu, University of Nottingham
    Xin Chen, University of Nottingham
    Melissa Harrison, EMBL-EBI
  abstract: |-
    Machine learning approaches for predicting brain disease outcomes commonly rely on high-resolution 3D imaging data, which is powerful but computationally expensive. Lower-resolution 2D images offer clear advantages for education and model prototyping: faster training, reduced computational cost, and improved generalisation. The biomedical literature contains a wealth of such images, including rare brain cancers and structural disease examples, but no scalable method currently exists to assemble them into AI-ready datasets.

    The BioFAIR FAIR-Figures pathfinder study addresses this gap by transforming publication figures into machine-actionable image datasets enriched with standardised metadata. The project unites the UK brain imaging research community with the Europe PMC literature database to build infrastructure for figure-level discovery, extraction, and reuse, building on prior work from the 2025 HDR UK and ELIXIR-UK joint hackathon.

    The workflow has three components. Multi-panel figures are automatically segmented into individual images for brain image classification using computer vision. Natural language processing extracts descriptive information from figure captions and in-text references, linking entities to controlled vocabularies such as SNOMED CT for consistent classification. This extracted information then populates a community-designed metadata model supporting discoverability and reuse, all integrated into a modular, containerised, reproducible workflow.

    A prototype figure-level search interface and API within Europe PMC will let researchers and educators build custom datasets by searching image-level metadata and retrieving AI-ready figures directly from the literature. The initial focus is brain imaging, targeting tens of thousands of indexed images with FAIR metadata.
