- number: '24'
  title: A Comprehensive, FAIR-Compliant Metabolome Resource for the Model Organism Research Community
  presenter: Ossama Edbali
  authors: |-
    Ossama Edbali (University of Birmingham, School of Biosciences)
    Thomas Kappas (University of Birmingham, Advanced Research Computing)
    Neil Butcher (University of Birmingham, Advanced Research Computing)
    Heather Turner (University of Birmingham, Advanced Research Computing)
    Mark R. Viant (University of Birmingham, School of Biosciences)
    Ralf J. M. Weber (University of Birmingham, School of Biosciences)
  abstract: |-
    Model organisms are central to fundamental and translational research across the life sciences. While large-scale genomic, transcriptomic, and proteomic initiatives have transformed our understanding of model-organism biology, progress in characterising their metabolomes and metabolic biochemistry has lagged, despite the critical roles of small molecules in cellular pathways, physiology, and environmental responses. Comparative genomics has revealed conserved and species-specific genetic features, yet systematic comparative metabolomics remains underdeveloped, largely due to a lack of specialised, scalable, FAIR-compliant resources and standardised workflows.
    The Deep Metabolome Annotation (DMA) strategy, developed at the University of Birmingham, has partly addressed this gap by combining diverse chromatographic separations with comprehensive multi-stage mass spectrometry and bespoke computational workflows to deliver high-confidence, reusable metabolite and lipid annotations. Applied to Daphnia magna, DMA yielded >8,500 annotations and a prototype community database and web portal, DMAdb. It includes open-source and Galaxy-based tools for data processing, quality control, and annotation.
    Supported through the BioFAIR Pathfinder initiative, this project aims to establish DMAdb as a multi-model-organism, FAIR-compliant community resource. DMA characterisations of Drosophila melanogaster and Caenorhabditis elegans will be incorporated alongside enhanced Galaxy-based tools and workflows and an improved web portal for cross-species exploration and visualisation. Integration with UK ELIXIR-endorsed resources, including MetaboLights, LIPID MAPS, and FlyBase, will strengthen interoperability and embed DMAdb within the wider ELIXIR/BioFAIR ecosystem. The resulting resource will enable comparative investigation of conserved and species-specific metabolism, support reuse of public metabolomics datasets, and provide a scalable foundation for future model-organism expansion and emerging annotation approaches.
