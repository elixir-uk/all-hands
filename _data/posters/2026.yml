- number: '13'
  title: 'RO-Crate: Packaging research outputs with FAIR metadata for reproducibility across domains'
  presenter: Phil Reed
  authors: |-
    Eli Chadwick, The University of Manchester
    Sanskrit Suthar, The University of Manchester
    Phil Reed, The University of Manchester
    Stian Soiland-Reyes, The University of Manchester
    Peter Sefton, University of Queensland
    Carole Goble, The University of Manchester
  abstract: |-
    RO-Crate is a mechanism for packaging research outputs along with structured metadata, providing machine-readability and reproducibility following the FAIR principles.

    Researchers can distribute their work as an RO-Crate to ensure their data travels with its metadata, so that key components are correctly tracked, archived, and attributed. Data stewards and infrastructure providers can integrate RO-Crate into the projects and platforms they support, to make it easier for researchers to create and consume RO-Crates without knowing the technical background.

    This poster outlines the RO-Crate project, its basic workings, and some of its most prominent use cases. The aim is to ensure ELIXIR members are aware of RO-Crate, and to spark further discussion about how RO-Crate can be incorporated into current and future ELIXIR projects.
