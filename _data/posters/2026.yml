- number: '11'
  title: 'BioFAIR Methods Commons: a national service for finding, running and sharing FAIR workflows in UK life sciences'
  presenter: Carole Goble
  authors: |-
    Shoaib Sufi (University of Manchester)
    Carole Goble (University of Manchester)
    Munazah Andrabi (University of Manchester)
    Stuart Owen (University of Manchester)
    Finn Bacall (University of Manchester)
    Nicola Soranzo (Earlham Institute)
    Tom Paine (Earlham Institute)
    Irene Papatheodorou (Earlham Institute)
    Cates Mallaney (Seqera)
    Laramie Lindsay (Seqera)
    Matteo Fiandesio (Seqera)
    Evan Flodden (Seqera)
  abstract: |-
    The BioFAIR Methods Commons is a new national service that gives UK life science researchers one place to find, run and share computational workflows. Funded through BioFAIR and launched in summer 2026, it is led by the University of Manchester and brings together the teams behind Galaxy, Nextflow (through Seqera) and the WorkflowHub registry.
    Workflow tools and compute resources in the UK are fragmented, and researchers range from wet-lab biologists who need no-code tools to developers running large Nextflow pipelines. The Methods Commons aims to serve this whole range. It joins cloud-hosted Galaxy and Nextflow execution with WorkflowHub for discovery, registration and quality review, and builds on community resources such as nf-core, the Intergalactic Workflow Commission and the Galaxy ToolShed rather than replacing them. Researchers will reach the service through a graphical interface, APIs or natural-language agents. Workflow Run RO-Crates will record the provenance of each run, and RO-Crate and GA4GH standards will support moving work between national and institutional compute.
    In its first year the team is building a minimum viable product with exemplar use cases, including bioimaging and neuroscience, through co-design and testing. Year 1 work includes an integrated WorkflowHub service, single sign-on through LS Login, run-level provenance storage, a user forum and onboarding support. In the second year the service will open to a wider set of users.
    The poster describes the service design and Year 1 roadmap, and explains how ELIXIR-UK members can take part as users, workflow contributors or partners.
  url: ''
- number: '12'
  title: 'WorkflowHub: A FAIR Registry for Computational Workflows Across Scientific Domains'
  presenter: Phil Reed
  authors: |-
    Finn Bacall, The University of Manchester
    Johan Gustafsson, Australian BioCommons, University of Melbourne
    Stuart Owen, The University of Manchester
    Phil Reed, The University of Manchester
    Sanskrit Suthar, The University of Manchester
    Nick Juty, The University of Manchester
    Munazah Andrabi, The University of Manchester
    Stian Soiland-Reyes, The University of Manchester
    Carole Goble, The University of Manchester
  abstract: |-
    WorkflowHub is an open-source registry designed for computational workflows (and standard operating procedures) and related resources used in scientific research. Its core mission is to enhance collaboration by making workflows more visible, citable, and shareable, thereby improving access to scientific knowledge. WorkflowHub plays a key role in strengthening scientific reproducibility, transparency, and the overall value of workflows by helping them adhere to FAIR (Findability, Accessibility, Interoperability, Reusability) principles.
    The platform supports open standards, including the Common Workflow Language, RO-Crate, Bioschemas, FAIR Signposting and GA4GH’s TRS API, enabling seamless discovery, reuse, and integration with various tools and platforms. WorkflowHub’s new RO-Crate submission API enables workflow communities to automatically create and maintain workflow entries in the catalogue. Metadata in WorkflowHub is enriched through integrations with services like BBMRI-ERIC’s LifeMonitor for workflow health-checking and ELIXIR’s bio.tools registry for linking workflows to the tools they utilize.
    WorkflowHub is open to all workflow languages and research communities. It currently hosts 1678 workflows spanning 40 formats, with over 300+ registered teams across disciplines such as biosciences, health, chemistry, biodiversity, climate and astronomy. Researchers can register work-in-progress workflows for collaborative development, and later publish them with DOIs for easy citation.
    The platform is led by ELIXIR in collaboration with the Australian BioCommons, with development guided by the biweekly WorkflowHub Club community call.
