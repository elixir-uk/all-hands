- number: '01'
  title: ELIXIR-UK Human Data & Tech Club - the story of our community-driven network for health data and technology in the UK
  presenter: Saskia Lawson-Tovey
  authors: |-
    Saskia Lawson-Tovey, The University of Manchester
    Tim Beck, The University of Nottingham,
    Wendi Bacon, Health Data Research UK
    Xenia Perez-Sitja, Earlham Institute
  abstract: |-
    At the ELIXIR-UK All Hands 2023, the ELIXIR-UK community came together and identified a need to gather, coordinate, and disseminate our human data activities amongst the ELIXIR-UK and wider ELIXIR communities.

    Launched in November 2023, the ELIXIR-UK Human Data & Tech Club (formerly Human Data Community) has gone from strength to strength. We have created an inclusive community for anyone interested in human data and infrastructure in the UK and beyond.
    Since founding the community we have significantly grown our membership and UK participation in ELIXIR initiatives, organised a national hackathon, and joined forces with the UK’s national institute for health data science, HDR UK, to boost cross-community collaboration and streamline our communication and facilitation efforts in the UK health data infrastructure space.

    Our key achievements:
    Consistent community growth from 0 to 205 members in just over 2 years
    Multiple meetings around inter/national topics of interest
    A significant increase in UK representation in ELIXIR Europe activities
    An increase from 0 to 6 attendees at the ELIXIR Federated Human Data community meeting
    UK members on 5 Human Data and Translational Research EOIs
    Community feedback on national software development
    2 community-driven workshops at ELIXIR AHM 2026
    A national joint hackathon co-hosted with HDR UK
    Partnership with HDR UK and recruitment of a third co-lead to support shared visibility and knowledge exchange across UK human data research infrastructure and technology.
