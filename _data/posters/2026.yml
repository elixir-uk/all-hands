- number: '19'
  title: PeerLadder – a national peer mentoring initiative supporting underrepresented dRTP leaders
  presenter: Saskia Lawson-Tovey
  authors: |-
    Saskia Lawson-Tovey, The University of Manchester
    Xenia Perez-Sitja, Earlham Institute
    Sara Villa, OLS
    Carole Goble, The University of Manchester
  abstract: |-
    PeerLadder is a new peer-mentoring initiative – a national programme to support leadership development and empower underrepresented digital Research Technical Professionals (dRTPs) to climb the leadership ladder together – building confidence, community, and inclusive leadership across UK research-performing organisations.

    dRTPs play a critical role in enabling data-driven research, yet many face limited progression routes and barriers to leadership, particularly women, disabled people, LGBTQIA+ professionals and those from minority ethnic backgrounds among others. The project addresses this gap through a structured peer-mentoring model that builds confidence, leadership capabilities, and professional networks.

    PeerLadder is part of the first cohort of community-led projects funded by DisCouRSE (a UKRI-funded Network+) to strengthen leadership, career pathways, and recognition among the digital research workforce.

    The pilot cohort comprises 15 dRTPs following our programme of training and peer mentoring. The group is 60% female, 47% from minority ethnic backgrounds, 33% from lower socioeconomic backgrounds, 27% neurodivergent, 20% carers, and 13% LGBTQIA+.

    As a pilot, it will demonstrate the value of this model nationally. Insights and outcomes will feed into other national initiatives, such as DisCouRSE, ELIXIR-UK, and the Software Sustainability Institute, informing future approaches to inclusive leadership, mentoring and career development across the UK digital research communities.

    Exchanging our knowledge and experiences with international collaborators is essential to increasing the representation of underrepresented technical professionals across the digital research landscape. We hope our small national project will inspire others to ask themselves what they can do and kickstart their own initiatives to support underrepresented dRTPs across the ELIXIR community.
