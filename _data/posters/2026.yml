- number: '07'
  title: 'Mind the gap: from FAIR policy to everyday research practice'
  presenter: Xènia Pérez Sitjà
  authors: |-
    Xènia Pérez Sitjà (PI, presenting), Earlham Institute
    Robert Andrews, Cardiff University
    Munazah Andrabi, University of Manchester
    Nicholas Owen, University College London
    Allyson Lister, University of Oxford
    Eva Caamano Gutierrez, University of Liverpool
    Richard Ostler, Rothamsted Research
    Korneel Hens, Oxford Brookes University
  abstract: |-
    The UK has no shortage of FAIR policy or guidance. Funders require data management plans, the FAIR principles are well established, and resources such as RDMkit, FAIRsharing and the FAIR Cookbook set out what good practice looks like. What is missing is the middle layer: the local, hands-on support that turns policy and guidance into what researchers actually do with their data, code and workflows. Without it, data management plans become a tick-box exercise, and digital research infrastructure fills with data that is hard to find, reuse or trust.

    The FAIR-in-action Bridge is a BioFAIR Pathfinder project led by the team behind the ELIXIR-UK research data management (RDM) community of practice, and it targets that middle layer. It gives research data professionals two openly licensed playbooks (CC BY 4.0) that they can run at their own institutions. Playbook 1 covers FAIRification – making research digital objects such as data, code and workflows findable, accessible, interoperable and reusable, including where no community repository exists. Playbook 2 covers communicating and advocating for FAIR. It contains engagement activities and games for reaching researchers and students who would never sign up for a course or ask for support. Both playbooks were written with the community: in 2026, 81 digital research technical professionals (dRTPs) and researchers took part in three online contentathons to build them.

    The playbooks are designed to be published from a public GitHub repository. An institution can add its own contacts and branding without any technical set-up, and suggest improvements through issues and pull requests.

    The project team is working with the University of Oxford, University College London, the Earlham Institute, Oxford Brookes University, Cardiff University, the University of Liverpool, Rothamsted Research and the University of Manchester to co-host in-person events. Travel bursaries will let staff from nearby institutions sit in on the sessions. Success means hosts running the activities again on their own.

    This work argues that the quality of digital research infrastructure depends on this middle layer.
