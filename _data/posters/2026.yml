- number: '05'
  title: Integrated Omics Approach to Psychiatry
  presenter: Theo Stolz
  authors: |-
    Theo Stolz (University of Bradford)
  abstract: |-
    Psychiatry currently operates a trial-and-error approach to psychotropic medication prescribing. Given the increase in personalised medicine overall and research into pharmacogenomics in psychiatry, there is potential for systematic change in the prescribing methodology. However, no centralised database exists dedicated to the pharmacogenomic interactions of psychotropics. Creating such a database would enable the development of models for personalised medicine to be practised in the psychiatric field. This poster outlines the development of a research database of antidepressants and pharmacogenomic interactions. Using MIAME and MINSEQE guidelines, research establishing interactions will be manually curated for rigour to ensure consistent standards are met. FAIR guiding principles are used throughout the database development, as advised through the data management plan developed using DS Wizard. The database will be constructed and integrated with the dedicated Galaxy server. A model development using phenotypes that underpin pharmacokinetic influences on antidepressants will provide evidence of the utility of the research database. This will allow for further models for guiding prescribing processes of antidepressants to be established and subsequently put into practice. The database being discussed thus acts as a step towards personalised medicine in psychiatry, where there is a widespread use of pharmacological intervention.
