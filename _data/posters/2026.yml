- number: '10'
  title: 'Living Best Practices for Agentic AI in Science: Shared and Citable'
  presenter: Huayu Xin
  authors: |-
    Sebastian Lobentanzer, Helmholtz Munich; Santiago Casas, German Aerospace Center (DLR); Gavin Farrell, University of Padova; Till Korten, Helmholtz-Zentrum Dresden-Rossendorf (HZDR); Marek Ostaszewski, Luxembourg Centre for Systems Biomedicine, University of Luxembourg; Fotis Psomopoulos, Institute of Applied Biosciences, Centre for Research and Technology Hellas (INAB|CERTH); Huayu Xin, University of Edinburgh
  abstract: |-
    Agentic AI is beginning to connect scientific data, tools and models across increasingly complex research workflows. Yet its rapid development outpaces conventional guidance: static reports often become outdated before publication, while institutions repeatedly produce overlapping recommendations. We present AI for Science (aiforscience.eu), an open, living and citable record of best practices for applying agentic AI to research, developed through European scientific communities including the ELIXIR Agentic AI Task Force and the Helmholtz AI Interest Group.
    The initiative brings together ten actionable practices spanning three interconnected areas. Method and infrastructure practices address choosing agents only when suited to the task, making scientific resources agent-accessible, vetting interfaces and designing them around researchers’ needs. Evidence and reliability practices call for machine-actionable documentation, traceable provenance and citation, and task-specific evaluation before reliance. Governance and risk practices define enforceable autonomy limits, named human accountability, effective oversight and screening for dual-use or high-consequence applications. Each practice translates evidence into guidance for researchers, infrastructure providers and institutional decision-makers.
    Rather than offering another fixed checklist, the project establishes a shared process for keeping guidance current. Contributors can submit documents, propose revisions and publicly challenge claims; AI-assisted source distillation is subject to human editorial review. Changes are traceable through an open repository, while dated releases with persistent DOIs support reliable citation. Organisations can endorse individual practices after review without imposing universal consensus. By combining technical recommendations with transparent, collaborative governance, this initiative offers a practical, adaptable foundation for deploying agentic AI while retaining essential scientific judgement, reproducibility and accountability.
