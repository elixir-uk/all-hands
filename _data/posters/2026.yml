- number: '03'
  title: Mapping Individual Patients' Resistance Signatures in Myeloma Reveals Candidate Therapeutic Targets and Novel Resistance Mechanisms
  presenter: Samuel Buchanan
  authors: |-
    Samuel Buchanan (Queen's University Belfast)
    Madhulika Verma (Queen's University Belfast)
    Ian Overton (Queen's University Belfast)
  abstract: |-
    Background:
    Myeloma is a terminal haematological malignancy, in which patients undergo an adaptive resistance-driven remission-relapse cycle, eventually exhausting therapeutic options. Therapy resistance is mediated by complex networks of genes with poorly understood, context-specific functions. To identify context-specific drivers of myeloma resistance, we employed a network modelling approach, revealing potential resistance mechanisms, druggable targets and companion biomarkers.

    Methods:
    We calculated personalised gene fold-change values by contrasting transcriptomic expression between 28 patients’ matched diagnostic and first-relapse samples. NetNC’s [Overton et al. Cancers 2020;12:2823] node-centric mode, with a HumanNet [NAR 2022;50:D632] biological prior, was used to construct 28 individual resistance networks from the top/bottom 500 genes ranked by fold-changes. These networks mapped biologically significant interactions between genes dysregulated in therapy resistance. We produced and analysed a summary union network (T11;14_T4;14_SumNet), using clusterProfiler to annotate coherent biological functions. We identified Resistance signature by clustering a patient-specific, binary gene expression matrix.

    Results:
    T11;14_T4;14_SumNet contained 2,834 genes, 35,455 interactions and 283 clusters encompassing dysregulation of an array of biological functions, including the cell cycle, immune responses and NF-KB signaling. Several of the T11;14_T4;14_SumNet clusters were differentially regulated in therapy resistance for many, or all, of the 28 patients. Clustering revealed 2 overarching heterogeneous resistance subgroups.

    Conclusion:
    Our analysis identified immune dysregulation driving Myeloma resistance. These alterations indicate therapeutic pressures drive cellular plasticity and the adoption of a dormant state to endure therapy. Commonality and heterogeneity in net-expression implicated genes and pathways in myeloma resistance, highlighting their potential as therapeutic targets and companion biomarkers.
