- number: '14'
  title: 'TeSS: a federated, FAIR-aligned platform for distributed management and exchange of training resources'
  presenter: Phil Reed
  authors: |-
    Phil Reed, The University of Manchester
    Munazah Andrabi, The University of Manchester
    Finn Bacall, The University of Manchester
    Oliver Knodel, Helmholtz-Zentrum Dresden - Rossendorf e.V
    Martin Voigt, Helmholtz-Zentrum Dresden - Rossendorf e.V
    Kenneth Rioja, CERN
    Maria Doyle, University of Limerick
    Carole Goble, The University of Manchester
  abstract: |-
    Training materials and events are widely dispersed and fragmented, making it challenging for users to identify relevant materials. Training e-Support System (TeSS) is a web-based open-source platform consolidating life science resources from various providers into an easy-to-use portal. It is a one-stop-shop for trainers and trainees to discover training materials, workshops, and online courses for bioinformatics, data science, and computational biology.

    For providers, TeSS makes it easy to make resources FAIR (Findable, Accessible, Interoperable, and Reusable). Utilising automated scrapers and open standards (Bioschemas, EDAM), materials are automatically discovered and registered from existing websites. Conversely, TeSS content can be easily embedded in other websites using HTML widgets or its JSON API.

    TeSS is a flagship training resource of ELIXIR, the largest European life sciences infrastructure, populated by 131 providers across 24 countries. The platform has been adopted by organisations outside ELIXIR, forming the basis of independent instances including PaNOSC Photon Neutron training, Digital Research Skills Australasia, Open Science Netherlands, Digital Research Alliance Canada and SciLifeLab. These instances operate independently, however, connections are now possible thanks to mTeSS-X, introducing sharing of nominated content between spaces via an exchange protocol.

    In the presentation we will highlight the TeSS salient features and how it facilitates training to be made FAIR. We will introduce the “Bioconductor Into TeSS and Beyond (BITS)” project, funded by the Institute for Research Software, to improve how TeSS gathers training information. It will develop a standardised, automated way to collect Bioconductor training materials, as a pilot for the wider community.
  url: ''
- number: '15'
  title: Bioschemas
  presenter: Nick Juty
  authors: |-
    Phil Reed, Nick Juty (both University of Manchester) Helena Schnitzer (Forschungszentrum Jülich)
  abstract: |-
    Bioschemas.org defines domain-specific metadata schemas based on schema.org extensions, which expose key metadata properties from resource records. This provides a lightweight and easily adoptable means to incorporate key metadata on web records, and a mechanism to link to domain-specific ontology/vocabulary terms. As an established community effort focused on improving the FAIRness of resources in the Life Sciences, we now aim to extend the impact of Bioschemas beyond improvements to ‘findability’.

    Bioschemas has been used to aggregate data in a distributed environment through federation, using metadata Bioschemas markup. More recently, we are leveraging Bioschemas deployments on resource websites, harvesting directly to populate SPARQL endpoints, subsequently creating queryable knowledge graphs.

    An improved Bioschemas validation process will assess the ‘FAIR’ level of the user’s web records and suggest the most appropriate Bioschemas profile based on similarity to those in the Bioschemas registry.

    Our learnings in operating this community will be extended into non-‘bio’ domains wishing to more easily incorporate ontologies and metadata in their web-based records. To that end, we have a sister site dedicated to hosting the many domain-agnostic types/profiles that have already emerged from our work (so far 7 profiles aligned to digital objects in research, e.g., workflows, datasets, training materials): schemas.science. Through this infrastructure we will develop a sustainable, cross-institutional collaborative space for long-term and wide ranging impact, supporting our existing community engagement with global AI, ML, and Training communities, and others in the future.
  url: ''
- number: '16'
  title: 'EVERSE RSQKit: Enabling Research Excellence. Practical Guidance & Tools to improve your project''s software health, trust and reproducibility'
  presenter: Michael Sparks
  authors: |-
    Michael Sparks (University of Manchester)
    Shoaib Sufi (University of Manchester)
    Aleksandra Nenadic (University of Manchester)
  abstract: |-
    Research depends on software, but trustworthy and reproducible results also rely on how that software is developed, shared and maintained. EVERSE brings together guidance, tools and community knowledge to improve research software practice across the lifecycle.

    This poster introduces key EVERSE resources. The Research Software Quality Toolkit (RSQKit) provides collaboratively curated, community-developed guidance for people who write, use or rely on research software, from novices to experienced practitioners. It organises advice around development and sharing tasks, lifecycle activities and the distance software has travelled towards becoming research software. Research Software Stories share examples and experience from research communities.

    The poster also presents emerging RSQKit guidance on generative AI in research software work. It maps practices across a spectrum of AI autonomy and intensity, from inline suggestions to autonomous agents. The guidance starts with the task and its risks, and emphasises clear boundaries, strong specifications and tests, separate workspaces, and review of AI outputs. Its central design principle is that greater autonomy is not inherently better: practitioners need the skills to perform lower-intensity versions of tasks to assess more autonomous outputs. Together, these resources make sound software practice more accessible and support more trustworthy and reproducible research.
  url: ''
- number: '17'
  title: 'RSpace: A data orchestration platform for research infrastructures and ecosystems'
  presenter: Rory Macneil
  authors: |-
    Rory Macneil, Research Space
  abstract: |-
    A new category of research infrastructure providers is emerging to complement universities, the traditional providers. National and supra-institutional generalist and domain specific research infrastructures offer the potential for wider access to a broad range of services, easier collaboration across institutions, and scalable and hence cost-effective deployment.

    This poster illustrates a fourth potential benefit of supra-institutional research infrastructures that becomes possible only if synergistic services are available to users as integrated packages rather than siloed tools. The role RSpace is playing in two planned national infrastructures is used to illustrate this point.

    RSpace is an open source research data orchestration platform that combines a core data management component with three elements - an electronic lab notebook, a sample management module and an instrument management module -- with integrations with an extensive ecosystem of research tools, infrastructures and services.

    Open APIs, combined with the ability to export data in a range of formats, including RO-Crate, facilitate streamlined exchange of data between RSpace and other tools. Support for a wide range of PIDs -- ORCIDs for people, RORs for institutions, RAiDs for projects, IGSN IDs for physical samples and PIDINSTs for instruments -- combined with the ability to incorporate controlled vocabularies enable association of metadata with research outputs in RSpace, and also, thanks to the integrations and open formats, when these outputs pass from RSpace to other tools.

    These principles are illustrated with visual presentations of the role RSpace is playing in the two planned national infrastructures.
  url: ''
- number: '18'
  title: 'NEOF: Empowering environmental researchers with Omics technologies and training'
  presenter: Matthew Gemmell
  authors: |-
    Matthew R. Gemmell (University of Liverpool, Centre for Genomic Research, NERC Environmental Omics Facility)
  abstract: |-
    The poster will give an overview of NEOF and what we have achieved since our formation in 2020.

    NEOF is a partnership between world-leading labs at the Universities of Liverpool and Sheffield who have pooled resources and expertise to deliver state-of-the-art omics expertise, capability and training to UK environmental scientists.

    We are funded by the Natural Environment Research Council (NERC).

    Our three primary pillars are: access to omics technologies, a visitor facility, and our bioinformatics training courses.

    Our omics technologies include: Genomic sequencing, Isoform analysis, Epigenomics, Single-cell omics, and quantitative metabolomics. To make these technologies more accessible we offer regular funding opportunities.

    Our visitor facility (based in the University of Sheffield) provides PhD students hands-on training in sample preparation for downstream omics technologies.

    Our final pillar, the main focus of the poster, is our bioinformatic workshops. We have run over 70 2-day courses since 2020. These cover the foundations of bioinformatics (e.g. intro to Linux, QC, python, R) to application specific courses (e.g. 16S rRNA, shotgun metagenomics, population genomics, etc.). All except one a year are online to cater to the entire UK. We are proud that we currently have a 100% recommendation rate from the thousands of attendees.
