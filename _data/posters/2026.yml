- number: '20'
  title: 'BIOMEDASA: Driving Innovation in Biomedical Data Science Through Collaboration'
  presenter: Eva Caamano Gutierrez
  authors: |-
    Eva Caamaño Gutiérrez1, Emily Johnson1, Anthony Evans1,Elisabeth Deja1, David Hughes1, Andrew Jones1, Christina McDonald1,Alasdair Ivens2

    1University of Liverpool (UoL), Liverpool, UK.2University of Edinburgh , Edinburgh, UK.
  abstract: |-
    Biomedical data science is fundamental to modern healthcare research, yet gaps in specialist expertise, training and career pathways continue to limit its effective integration into research teams.
    BIOMEDASA (Biomedical Data Science Accelerator) is an MRC-funded initiative led by the University of Liverpool, working with UK partners to strengthen biomedical data science capacity and foster a more inclusive, sustainable workforce.
    Through five interconnected pillars — Enhance, Nurture, Analyse, Reskill and Inspire (ENARI) — the programme combines embedded expertise, professional development, educational research, cross-sector mentoring and widening participation.
    Early achievements demonstrate progress across the biomedical data science career pipeline. Data professionals have been embedded within clinical research teams, contributing to publications, grant applications and improvements in research data quality. Training in experimental design, FAIR principles and Generative AI in research has reached 276 participants synchronously and 628 asynchronously, with 100% of respondents recommending the sessions. A national audit has mapped 73 postgraduate programmes across 30 universities, as well as student surveys and focus groups, identifying emerging gaps between training provision and workforce needs. The BioDataBridge mentoring programme has recruited 15 mentees and 15 mentors to support career transitions, while school outreach has engaged 350 pupils across 25 activities, with 66% of surveyed KS3 participants reporting increased confidence in programming. Research with teachers has also broadened our understanding of barriers and enablers to accessing computing careers.
    Initial findings also highlight systemic challenges: 92.3% of surveyed clinicians lacked dedicated data expertise before the intervention and low engagement with FAIR, emphasising the importance of integrating data professionals into research teams from the outset.
    BIOMEDASA demonstrates how coordinated interventions spanning education, research and healthcare can address structural barriers, strengthen interdisciplinary teams and support a more capable, diverse and sustainable biomedical data science workforce.
