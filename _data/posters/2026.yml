- number: '23'
  title: 'Driving discovery through FAIR principles: A case study of support with long read RNAseq data'
  presenter: Rachael Thompson and Dorothea Seiler Vellame
  authors: |-
    Rachael Thompson1,2, Dorothea Seiler Vellame1,2, Sam Fletcher1,2, Lucia Dutan Polit3, Rosemary Bamford2, Szi Kay Leung2, Jonathan Mill1,2, Deepak Srivastava3

    1. UK Human Functional Genomics Initiative, 2. University of Exeter, 3. King’s College London
  abstract: |-
    The UK Human Functional Genomics Initiative (FGx) aims to characterise the functional consequences of variants to improve understanding of biological mechanisms and develop new treatments. It is a national organisation containing five research clusters, 16 FGx-funded pilot projects, supported by the Coordination Hub and Data Coordination Centre (DCC).

    The Initiative is producing vast quantities of multi-modal data, including omics and imaging, across a range of biological areas. As the DCC, we aim to accelerate scientific breakthroughs in functional genomics by enabling scientists to find, use, and share this data.

    The DCC’s first aim was to survey FGx researchers to understand where help was required. Through this, a need for support with long-read RNAseq metadata and analysis was identified. To document this, we will produce a case study with the following aims:

    Create applicable metadata schema for long-read RNAseq data
    Through collaboration with the European Bioinformatics Institute (EMBL-EBI), we have access to a metadata schema prototype for short read RNAseq data.
    Write a broadly applicable long-read RNAseq data preparation pipeline
    Existing internal pipelines required adapting and updating especially with regards to software versioning and dependencies.
    Communicate in an open and transparent way to allow others to learn from us (and our mistakes)
    This will also improve understanding of how to support researchers effectively.

    We are interested in speaking to others about developing useful case studies, metadata schema, and maintaining research pipelines.
