- number: 08
  title: 'FAIRPath: making plant pathology experiments more FAIR through better standards, semantics and practical tools'
  presenter: Richard Ostler
  authors: |-
    Richard Ostler, Andrew Mead, Hsin-Yu Chang, Tegan Darch, Gail Canning (all Rothamsted), Philippe Rocca-Serra (Oxford), Aoife O'Driscoll NIAB
  abstract: |-
    FAIRPath: Foundations for a FAIRer Plant Pathology Community is a BioFAIR Pathfinder project which aims to improve the interoperability and reuse of data from field and controlled environment experiments, using Plant Pathology as an example domain.
    Progress on the Statistics Ontology is establishing additional representation of experimental design, for example separating blocking structure, treatment structure and treatment allocation, while explicitly representing experimental units, replication and randomisation. In parallel, FAIRPath is contributing to the development of MIAPPE, including improved representation of experimental factors and factor levels to support consistent description and cross-experiment reuse.
    These developments are being translated into a researcher-friendly MIAPPE Excel template, providing structured metadata capture within an interface familiar to researchers. Next steps will include an RO-Crate transformation and community BYOD workshops.
