- number: '02'
  title: CRUK Data Hub
  presenter: Frances Pearl
  authors: |-
    Sarah Wooller1, Ayoola Olojede1, Sam Cox2, Sanika Raut3, Andrew Levy1, Christopher Tso4 , Andrew Blake5,6,Iliada Eleftheriou5,7,Meike Van Hemelrick5,8, Leslie Glass3, Joseph Day4, Loki Sinclair2, Peter Harrison2, Frances M G Pearl1,5*

    1 Bioinformatics Group, University of Sussex,

    2 HDR-UK,

    3 Cancer Research UK,

    4 Cancer Research Horizons

    5 CRUK data advisory group,

    6 University of Oxford,

    7 University of Manchester

    8 KCL
  abstract: |-
    CRUK has funded the generation of thousands of cancer datasets, but most are only known to researchers directly involved in their generation or their established collaborators. It is very difficult for other researchers to know what data has already been generated and how to access these datasets or samples for re-analysis. The process taken to access these data is often significantly time-consuming.

    The CRUK Data Hub is a joint venture between the University of Sussex - Pearl Bioinformatics Lab, Cancer Research UK, Health Data Research UK, Cancer Research Horizons and the group advisors of the CRUK Data Science Community.

    Using the power of the HDR UK Gateway we aim to make CRUK cancer datasets more findable and accessible. As well as inheriting HDRUK’s elastic search the hub will enable datasets to be filtered by cancer type, data type and accessibility. Here we present our designs for the search, meta data and upload pages.
