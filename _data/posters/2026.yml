- number: '22'
  title: Bridging communities with OME-Zarr
  presenter: Jean-Marie Burel
  authors: |-
    OME consortium
  abstract: |-
    Advanced imaging modalities are used across scientific domains which create large, multidimensional, information-rich datasets . Being able to exploit such data in full via cross-dimensional data processing and analysis demands critical file format and data structure capabilities, pivotal to enabling efficient collaboration, sharing and reuse. They are defined in the OME-NGFF (next-generation file format) specification and implemented through OME-Zarr for adoption in imaging-driven research.
